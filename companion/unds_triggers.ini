; UNDS — efectos de gatillo y lightbar (por el port, HID directo o DSX). Se recarga al guardar.
;
; Efectos (sintaxis de los modos v3 de DSX; con backend = port o hid se codifican como los efectos oficiales del mando):
;   OFF
;   FEEDBACK  <inicio 1-9> <fuerza 1-8>                     resistencia constante desde una posición
;   WEAPON    <inicio 2-7> <fin 3-8> <fuerza 1-8>           tramo duro que se rompe (gatillo de arma)
;   VIBRATION <inicio 1-9> <amplitud 1-8> <frecuencia 1-40> vibración a partir de una posición
;   SLOPE_FEEDBACK <inicio 1-8> <fin 2-9> <fuerza ini 1-8> <fuerza fin 1-8>
;   MULTIPLE_POSITION_FEEDBACK  <10 fuerzas 0-8>
;   MULTIPLE_POSITION_VIBRATION <frecuencia 1-40> <10 amplitudes 0-8>
;   MACHINE <inicio 1-8> <fin 2-9> <fuerza A 0-7> <fuerza B 0-7> <Hz 1-255> <periodo 1-255, décimas de s>
;           solo backend = port o hid: oscila entre las fuerzas A y B (efecto 0x27 "no oficial" del mando)
; kick y auto_kick admiten SECUENCIAS (Día 6): "EFECTO @ms > EFECTO @ms ..." = fases seguidas en cada
; disparo. Un solo efecto sin @ dura kick_ms / auto_kick_ms.
; Medido en un DualSense: WEAPON 2 4 ocupa r2a ~24-67 de 255 (~11-26 % del recorrido).
; El port da R2 por pulsado al pasar UNDS_TRIGGER (UNDS.exe pone 30,95). Si cambias el FIN del WEAPON de R2,
; vuelve a calibrar (python unds_triggers.py --calibrate). Cambiar solo inicio o fuerza no lo exige.

[output]
; Día 8: port = el companion manda cada cambio al port (canal fx, parche 0004) y el port lo escribe con SDL:
;              sin hidapi, por USB o Bluetooth, SDL único escritor del mando (los hápticos siguen siendo USB)
;        hid = HID directo por USB desde el companion (el de los Días 4-7; necesita hidapi)
;        dsx = Mod System de DSX (DSX abierto apaga los hápticos)
; Con cualquiera, DSX CERRADO. unds.py --backend hid|port|dsx gana a esta línea.
backend = port

; [dsx]: port y controller solo con backend = dsx; reassert_s, status_s y min_interval_ms valen para todos.
; Con backend = port, reassert_s debe quedar por debajo de 5 s: el port suelta los gatillos si pasa 5 s
; sin recibir nada del companion (companion cerrado o colgado).
[dsx]
port = auto            ; auto = %LOCALAPPDATA%\DSX\DSX_UDP_PortNumber.txt, si no 6969
controller = auto      ; auto = primer DualSense que lista DSX; o un índice
reassert_s = 2.0       ; reenvía el estado completo si no hubo cambios en este tiempo
status_s = 5.0         ; GetDSXStatus periódico (vida de DSX e índice del mando)
min_interval_ms = 4    ; separación mínima entre paquetes a DSX

[default]
l2 = FEEDBACK 4 1              ; peso al apuntar: fuerza mínima del mando (1) desde el 40 % del recorrido (antes 2 1, desde el 20 %)
r2_idle = WEAPON 3 4 5         ; R2 sin apuntar: tope corto (antes 3 4 3)
r2_aim = WEAPON 3 4 8          ; R2 apuntando: tope al máximo para apoyar el dedo y luego romperlo (antes 3 4 6)
; Día 6 (3): golpe de la pistola más leve y corto: con amplitud 8 y 70 ms la vibración tapaba el tope del
; WEAPON y el gatillo se sentía duro todo el rato al disparar seguido. Ahora un toque (amplitud 4, 35 ms)
; y el tope de r2_aim / r2_idle vuelve antes. Antes: kick = VIBRATION 1 8 40 (con kick_ms = 70)
kick = VIBRATION 1 4 40 @35    ; retroceso en R2 al disparo real (armas semiautomáticas)
;   más suave todavía:         kick = VIBRATION 1 2 40 @25
;   empujón en vez de vibrar:  kick = FEEDBACK 1 5 @30
;   sin golpe en el gatillo:   kick = OFF @1
kick_ms = 70                   ; solo si kick es un efecto sin @
menu_l2 = OFF                  ; con la lightbar en menu_rgb sostenida (pausa, menú, carga)
menu_r2 = OFF
menu_rgb = 0,0,255
menu_debounce_ms = 150         ; el azul de ~35 ms al reaparecer no cuenta como menú
fire_s_min = 200               ; firma de disparo: motor pequeño >= fire_s_min ...
fire_l_max = 120               ; ... y motor grande <= fire_l_max (U1 pistola: 76,255 y 120,255)
fire_r2_window_ms = 800        ; R2 pulsado en esta ventana (sin apuntar el disparo sale ~210 ms después)
; --- firmas de rumble medidas en U1 (2026-10-22): disparo de pistola (76,255); AK-47 (114,255) sostenido;
;     daño recibido = motor pequeño a 255 y grande AL AZAR 0-75. Por eso el disparo exige grande >= fire_l_min.
fire_l_min = 76
auto_l = 114                   ; motor grande de las armas automáticas (lista separada por comas)
auto_period_ms = 106           ; cadencia medida en el audio de la AK-47 (9,4 disparos/s)
; Día 6: en cada bala de la automática el gatillo EMPUJA el dedo (FEEDBACK a tope desde el inicio) y
; después vibra; el resto del intervalo (rifle de U1: 136 ms entre balas) vuelve a r2_aim/r2_idle, que
; pasado el tope ya no ofrece resistencia: sube-baja una vez por bala, en sincronía con el juego.
auto_kick = FEEDBACK 1 8 @55 > VIBRATION 1 8 40 @25
;   Día 4-5 (solo vibración):   auto_kick = VIBRATION 1 8 40   (con auto_kick_ms = 50)
;   solo empuje, más marcado:   auto_kick = FEEDBACK 1 8 @70
;   oscilación propia del mando, no sincronizada con las balas (con @ menor que la cadencia se reinicia en
;   cada bala):                 auto_kick = MACHINE 1 9 7 1 30 1 @130
auto_kick_ms = 50              ; solo si auto_kick es un efecto sin @
; --- vida estimada -> lightbar: se tiñe de rojo cuanta menos vida te queda [estimación por golpes] ---
;     (en U1 no hay barra de vida; el juego solo cambia la luz al morir). Con estado real (state = auto
;     y port con el parche 0004) el tinte sigue la vida real y damage_step/hold/recover no se usan.
damage = on
damage_rgb = 255,0,0           ; color con la vida al mínimo
damage_step = 0.25             ; vida que quita cada golpe (U1: ~4 ráfagas de daño seguidas = muerte)
damage_flash_ms = 180          ; destello a color completo en cada golpe
damage_hold_ms = 2500          ; sin recibir daño, cuánto tarda en empezar a recuperarse
damage_recover_ms = 4000       ; de vida mínima a completa una vez que empieza a recuperarse
; --- contexto: gatillos sin resistencia fuera de combate (cinemáticas, tramos sin arma) [heurística] ---
context = combat               ; combat | always (= como antes)
combat_s = 40                  ; en combate hasta 40 s después del último disparo propio, daño o apuntado
aim_arm_ms = 250               ; mantener L2 este tiempo también activa el combate
calm_l2 = OFF                  ; efectos en calma
calm_r2 = OFF
led = game                     ; game = lightbar del juego por DSX | off = no tocarla
led_brightness = 255
led_gain = 4.0                 ; el juego usa colores tenues (32,32,0): x4 -> (128,128,0); muerte (64,0,0) -> (255,0,0).
                               ; Conserva el tono (no satura un canal). 1.0 = color original del juego
death = hold                   ; hold = rojo fijo desde la muerte hasta reaparecer y luego degradado | game = tal cual
death_rgb = 64,0,0             ; U1: color de vida crítica, también al morir (sin estado real = muerte)
death_hold_ms = 6000           ; máximo de rojo fijo si no se detecta la reaparición (en U1 tarda ~4,0 s)
death_fade_ms = 1500           ; degradado rojo -> color del juego tras reaparecer
death_l2 = OFF                 ; gatillos durante la muerte
death_r2 = OFF
; --- estado REAL del juego (Día 5, parche 0004; por ahora U1 1.00). Sin eventos gs/shot/dmg del port
;     (U2/U3, otra versión, UNDS_STATE=0) se usa lo de arriba: firmas de rumble y vida estimada ---
state = auto                   ; auto = usar vida/munición/daño reales si el port los publica | off = ignorarlos
fire_source = auto             ; auto = evento shot si hay estado real, si no firma de rumble | rumble | state
auto_gap_ms = 200              ; dos shot del mismo arma a menos de esto = arma automática (se aprende sola)
empty_r2 = OFF                 ; R2 con el cargador vacío (vida real: cargador = 0 y tamaño > 0)
health_led = game              ; game = el color del juego (en U1 YA sigue la vida: amarillo sano -> 64,0,0 crítica)
                               ; state = degradado propio desde la vida real hacia damage_rgb (más rojo, más rápido)
health_curve = 1.0             ; solo con health_led = state: tinte = (1 - vida)^curva
; --- Día 6: cinemáticas. Con estado real, el juego deja de actualizar a Drake (ups = 0) y la luz NO se
;     pone azul (medido: 2 cinemáticas de 39 y 44 s; las pausas/cargas sí son azules). Se detecta en el
;     refresco de estado (~0,5 s) y los gatillos pasan a cutscene_l2 / cutscene_r2 hasta que vuelve el control.
cutscene = state               ; state = detectar cinemáticas por el estado real | off = no detectarlas
cutscene_l2 = OFF              ; gatillos durante la cinemática
cutscene_r2 = OFF
; --- Día 7: sin arma en la mano (w = 0x0) durante unarmed_ms (el cambio de arma pasa ~0,45 s por 0x0) ---
unarmed_l2 = OFF
unarmed_r2 = OFF
unarmed_ms = 1000
; --- Día 8b: armas montadas (U1: jeep al escapar de Eddy = R2 torreta + L2 granadas; moto acuática = R2 lanzagranadas + L2 apuntar) ---
; No pasan por el código de armas del juego (para el port vas "sin arma" y no hay evento shot): se reconocen
; por el rumble que el juego pone 3-6 ms después de pulsar (R2: 114/255 sostenido; L2: pulso de 255). Desde el
; primer disparo y hasta mounted_hold_ms sin disparar (o al tomar un arma o empezar una cinemática):
; R2 = r2_idle de mounted_r2_class + su auto_kick cada mounted_period_ms mientras disparas; L2 = mounted_l2
; + el kick de mounted_l2_class en cada granada. Los hápticos usan la voz de esas clases.
mounted = on                   ; on | off
mounted_window_ms = 30         ; pulsación -> rumble (medido: 3-6 ms)
mounted_hold_ms = 30000        ; el modo dura esto desde el último disparo montado (moto: ~16 s entre disparos)
mounted_period_ms = 120        ; [HIPÓTESIS] cadencia de la torreta: el rumble no la deja ver; 120 ms = la del fuerte
mounted_r2_class = torreta              ; R2 con rumble sostenido = ráfaga (torreta del jeep)
mounted_r2_single_class = lanzagranadas ; R2 con pulso de 255 = disparo único (lanzagranadas de la moto acuática)
mounted_r2_light_class = pistola        ; R2 con firma de pistola (76,255 que se corta a ~120 ms) = disparo único (moto acuática, 2.ª parte: Elena con pistola)
mounted_l2_class = lanzagranadas
mounted_l2 = FEEDBACK 2 4      ; L2 entre granadas (si L2 solo apunta, como en la moto, usa el l2 normal): peso constante desde la zona 2 (no es un tope: el port da L2
;                                por pulsado en 30/255 y un WEAPON lo dispararía antes de romperlo). Más duro: FEEDBACK 2 6
; con estado real la muerte es vida = 0 (no el LED 64,0,0, que también sale con vida crítica) y la
; reaparición, la vida de vuelta al 100 % o el destello azul, lo que llegue antes

[u1]

[u2]

[u3]

; ==================================================================================================
; Día 7: PERFILES POR ARMA (con estado real: U1). Cada arma tiene una CLASE; la clase cambia solo estas
; claves: l2, r2_idle, r2_aim, kick (+kick_ms), auto_kick (+auto_kick_ms), empty_r2, y automatica (si|no|auto).
; Orden: [default] < [u1] < valores de la clase < [clase X] < [arma 0x...]. Lo que no pongas se hereda.
;
; Valores de cada clase (en el código; para cambiarlos crea [clase X] con la clave):
;   pistola        = los de [default] (Día 6: kick VIBRATION 1 4 40 @35)                          automatica no
;   revolver       r2 WEAPON 3 4 7 / 3 4 8 (tope duro también sin apuntar); kick FEEDBACK 1 8 @45 > VIBRATION 1 6 30 @40   no
;   subfusil       r2 WEAPON 3 4 4 / 3 4 6 (más ligero); auto_kick FEEDBACK 1 6 @40 > VIBRATION 1 6 40 @20 si
;   automatica     = los de [default] (Día 6: auto_kick FEEDBACK 1 8 @55 > VIBRATION 1 8 40 @25)       si
;   escopeta       r2 WEAPON 2 4 6 / 2 4 8 (tope más largo, desde la zona 2); kick FEEDBACK 1 8 @70 > VIBRATION 1 8 25 @60  no
;   lanzagranadas  r2 WEAPON 2 4 8 / 2 4 8 (largo y al máximo); kick FEEDBACK 1 8 @110 > VIBRATION 1 8 15 @140 (golpe pesado)  no
;   torreta        l2 OFF; r2 FEEDBACK 3 4 (gatillo pesado constante); auto_kick FEEDBACK 1 8 @50 > VIBRATION 1 8 25 @35  si
;   granada        r2 OFF, kick OFF                                                                        no
; Ejemplo:  [clase escopeta]
;           kick = FEEDBACK 1 8 @90 > VIBRATION 1 8 20 @80
; OJO: deja el FIN de los WEAPON en 4 (o menos). El umbral de pulsación del port (UNDS_TRIGGER=30,95) vale
; para todas las armas y está justo después del tope de WEAPON 3 4: con un tope más hondo el disparo sale
; antes de romperlo. Para topes más hondos habría que subir el umbral (y recalibrar: --calibrate).
;
; Un id que no esté abajo se clasifica solo: munición infinita = torreta, cargador 1 = lanzagranadas,
; disparos a < auto_gap_ms = automatica, si no pistola. El companion escribe "ARMA 0x... = nombre: clase"
; cada vez que cambias de arma: si el nombre no es el que ves en el juego, corrígelo aquí.
;
; Armas vistas en tus partidas de U1 (2026-10-23). Nombres = HIPÓTESIS por ranura, cargador y cadencia:
[arma 0xfa98d21c]
nombre = pistola inicial (cargador 8)
clase = pistola

[arma 0x8b8bc9a2]
nombre = revólver (cargador 6, ranura 2)
clase = revolver

[arma 0x6f178c4a]
nombre = subfusil (cargador 20, 118 ms entre balas)
clase = subfusil

[arma 0x58d20069]
nombre = rifle de asalto (cargador 30, 147 ms entre balas)
clase = automatica

[arma 0x8632c9ad]
nombre = escopeta (cargador 6, ranura 3)
clase = escopeta

[arma 0x25be4291]
nombre = lanzagranadas (cargador 1)
clase = lanzagranadas

[arma 0x9fac1aef]
nombre = torreta / arma montada (munición infinita)
clase = torreta

[arma 0x7f3fd992]
nombre = granada (ranura 4)
clase = granada
