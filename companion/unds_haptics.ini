; UNDS — Día 4: hápticos por WASAPI (canales 3-4 del DualSense por USB). unds.py lo recarga al guardar.
;
; Requisitos: DualSense por USB; en Windows "Altavoces (Wireless Controller)" en Cuadrafónico
; (Panel de control > Sonido > Reproducción > Configurar), volumen de ese dispositivo al 100 %;
; port con UNDS_RUMBLE=0 (si SDL manda rumble, el mando ignora los hápticos por audio);
; hápticos/audio-to-haptics de DSX apagados.
;
; Voces:  SINE  <hz> <ms> <ganancia 0-2> <pan -1..1> <caída_ms>      seno con caída exponencial
;         NOISE <corte_hz> <ms> <ganancia> <pan> <caída_ms>          ruido con paso bajo (textura, golpe)
;         capas sumadas con "+";  OFF = sin voz.  pan: -1 izquierdo, 0 ambos, +1 derecho.
;         caída_ms = 0 -> amplitud plana.  Todas arrancan y terminan en cero (sin chasquido).
; Las frecuencias por defecto son un punto de partida [HIPÓTESIS]: ajústalas con
;   python unds_haptics.py --sweep        (anota dónde se siente más fuerte y más limpio)

[device]
name = auto          ; auto = salida WASAPI que contenga "Wireless Controller" o "DualSense"; o una subcadena
exclusive = no       ; yes = WASAPI exclusivo (menos latencia; nadie más puede usar el altavoz del mando)
latency = low        ; low | high | milisegundos (sube a 20-30 si hay underflows)
channels = 3,4       ; actuador izquierdo, derecho (1-based). Si --test los invierte: 4,3
master = 1.0         ; ganancia global; por encima de 0,8 actúa un limitador suave (ver "limitador" en STATS)
align_ms = 0         ; retraso añadido a las voces para alinearlas con imagen/sonido

[default]
; --- 1. rumble del juego -> hápticos (emulación de los dos ERM del DS4) ---
rumble = on
rumble_l_hz = 35-60          ; motor grande: frecuencia a intensidad mínima - máxima
rumble_s_hz = 130-190        ; motor pequeño
rumble_l_gain = 0.7          ; con los dos motores a tope suman ~1 (sin limitador)
rumble_s_gain = 0.5
rumble_l_pan = -0.3          ; en el DS4 el motor grande está a la izquierda y el pequeño a la derecha
rumble_s_pan = 0.3
rumble_curve = 0.8           ; amplitud = intensidad^curva (<1 realza los rumbles suaves)
rumble_attack_ms = 15        ; inercia del motor al acelerar
rumble_release_ms = 45       ; ... y al frenar
; --- 2. voces por evento ---
; Día 6 (3): disparo más leve, más corto y casi centrado: cargado a la derecha (0,6) el actuador derecho,
; bajo el dedo del gatillo, tapaba el efecto de R2. Antes: SINE 65 110 0.8 0.6 40 + NOISE 300 30 0.35 0.6 8
fire = SINE 65 80 0.55 0.2 30 + NOISE 300 25 0.25 0.2 6 ; disparo propio (semiautomática): cuerpo grave + golpe seco
fire_duck_ms = 190           ; silencia la capa 1 durante el disparo (firma del arma ~182 ms en U1); no si el motor grande > fire_l_max (explosión)
fire_auto = SINE 65 60 0.85 0.6 22 + NOISE 300 18 0.35 0.6 6 ; cada disparo de una ráfaga automática (AK-47: 1 cada 106 ms)
; --- Día 6: daño direccional (evento dmg del estado del juego, U1) ---
; Golpe seco a 70 Hz + chasquido de ruido. Se reparte entre los actuadores según el lado de la fuente
; (0° delante, + derecha, - izquierda, relativo al cuerpo de Drake) y su fuerza sigue al daño.
; Deja el pan de las capas en 0: la dirección lo pone hit_pan.
hit = SINE 70 150 1.0 0 55 + NOISE 220 60 0.55 0 15         ; golpe de LADO (90°)
; Día 6 (2): delante/detrás por TIMBRE (dos actuadores no dan profundidad por posición).
; Se mezclan según el ángulo: 0° = solo hit_front, 180° = solo hit_back, 90° = solo hit, 45° = 71 % front + 29 % hit.
hit_front = SINE 160 90 0.9 0 30 + NOISE 600 40 0.6 0 10    ; DELANTE: agudo, corto y seco (chasquido)
hit_back = SINE 45 230 1.0 0 90 + SINE 70 120 0.45 0 40     ; DETRÁS: grave, más largo y pesado (45 Hz rinde menos: va a tope)
hit_timbre = on              ; off = sin diferencia delante/detrás (solo hit)
hit_timbre_curve = 1.0       ; >1: el timbre solo cambia cerca de 0°/180°; <1: cambia antes
hit_direction = on           ; off = centrado siempre
hit_pan = 1.0                ; 1 = un golpe a 90° solo en ese lado; 0,6 = deja algo en el otro
hit_pan_curve = 0.6          ; <1: las diagonales se van antes a su lado (45° -> 0,81 del todo)
hit_gain_min = 0.6           ; fuerza con un daño mínimo (perdigón: 13-21 milésimas de vida) ...
hit_full_amt = 90            ; ... y fuerza completa desde este daño (bala de rifle en U1: 90-92)
hit_source = state           ; state = solo con el evento dmg | any = también por la firma de rumble (U2/U3, sin dirección)
hit_duck_ms = 300            ; mientras suena el golpe, el rumble de daño del juego baja a ...
hit_duck = 0.2               ; ... esta fracción (0 = silencio; 1 = sin atenuar). No afecta a explosiones (motor grande > fire_l_max)
; muerte: golpe a 60 Hz (la más fuerte en tu barrido) + retumbe grave a 40 Hz que se apaga poco a poco
; (caída 1,7 s: a los ~4 s de la reaparición en U1 queda ~10 %). Al reaparecer se corta con death_stop_ms.
; Día 5: más fuerte. Golpe al doble (0.5 -> 1.0, 300 ms) y retumbe a 50 Hz en vez de 40 (40 Hz rinde
; poco en el actuador según tu --sweep; 60 Hz es el máximo). Anterior: SINE 60 250 0.5 0 90 + SINE 40 6000 0.9 0 1700
; Día 5 (2): aún más: golpe a tope 450 ms y retumbe que tarda más en caer (1,7 -> 2,5 s). Ya va al
; limitador: más fuerza solo se gana con duración; el resto (atenuar el rumble del juego al morir) en el Día 6.
death = SINE 60 450 1.0 0 200 + SINE 50 6000 1.0 0 2500
death_stop_ms = 150          ; fundido al detectar la reaparición (0 = deja que la voz termine sola)
death_duck = 0.0             ; Día 6: rumble del juego (todo) durante la muerte, hasta reaparecer: 0 = silencio
death_duck_max_ms = 8000     ; seguridad: si no se detecta la reaparición, el rumble vuelve a este tiempo
; --- 3. audio -> hápticos (envolvente de graves del puerto main; la música va mezclada en main) ---
audio = off                  ; off | transient (solo subidas bruscas: explosiones, golpes) | level (nivel continuo)
audio_hz = 55
audio_gain = 0.6
audio_pan = 0
audio_floor_db = -45         ; por debajo, nada
audio_margin_db = 6          ; transient: dB por encima del nivel medio lento para empezar a sentirse
audio_range_db = 12          ; dB desde el umbral hasta la amplitud máxima
audio_slow_ms = 400          ; transient: constante del nivel medio
audio_attack_ms = 3
audio_release_ms = 60

[u1]

[u2]

[u3]

; ==================================================================================================
; Día 7: VOZ DE DISPARO POR ARMA. La clase de cada arma la decide unds_triggers.ini ([arma 0x...] clase =).
; Aquí solo se cambian fire (semiautomáticas) y fire_auto (cada bala de una automática).
; Orden: fire / fire_auto de arriba < clase (código) < [clase X] < [arma 0x...]. OFF = sin voz.
; Valores de cada clase en el código (pistola y automatica usan los de arriba):
;   revolver       fire      = SINE 55 140 0.9 0.2 50 + NOISE 250 40 0.4 0.2 10   más grave y largo
;   subfusil       fire_auto = SINE 75 45 0.6 0.3 15 + NOISE 350 15 0.3 0.3 5     más ligero y rápido
;   escopeta       fire      = SINE 50 180 1.0 0 70 + NOISE 220 70 0.6 0 20       golpe ancho, centrado
;   lanzagranadas  fire      = SINE 45 260 1.0 0 110 + SINE 90 80 0.4 0 25        empujón sordo y largo
;   torreta        fire_auto = SINE 55 70 0.95 0 25 + NOISE 250 25 0.45 0 8      pesada, centrada
;   granada        fire      = OFF
; Ejemplos:
; [clase escopeta]
; fire = SINE 45 220 1.0 0 90 + NOISE 200 80 0.7 0 25
; [arma 0x58d20069]
; fire_auto = SINE 60 55 0.9 0.5 20 + NOISE 300 18 0.4 0.5 6
