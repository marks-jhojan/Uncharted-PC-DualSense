; UNDS — ajustes del lanzador (UNDS.exe). Se leen al abrirlo.

[game]
; Carpeta de la release del port (la que tiene Uncharted.exe). Vacío = la busca junto a UNDS.exe y en la
; carpeta de encima; si no la encuentra, la pregunta y la apunta aquí.
dir =

[launcher]
; yes = el juego arranca UNDS solo (run.py, parche 0008), lo abras como lo abras; no = solo con UNDS.exe.
auto = yes
; console = en una consola minimizada en la barra de tareas; hidden = sin ventana, en segundo plano.
; En los dos casos queda el registro en logs\unds.log (el de la partida anterior en logs\unds.prev.log).
window = console
; yes = graba cada partida en recordings\ (JSONL, decenas de MB por partida; para reportar fallos).
record = no
; GB de memoria libre (RAM + archivo de paginación) por debajo de los cuales avisa antes de abrir el juego.
min_free_gb = 11.5
; Segundos que parpadea la lightbar en rojo cuando el port avisa de un problema (arranque defectuoso,
; pérdida de datos, aserción o caída).
alert_seconds = 20
; DSX abierto apaga los hápticos; un bb-probe.exe de antes retiene ~6 GB: ask | yes | no
; (arrancado por el juego no hay a quién preguntar: ask solo avisa)
close_dsx = ask
close_old_game = ask
; Instrucciones sin reescribir por encima de las cuales el arranque se da por defectuoso (lo normal: 46).
red_zone_threshold = 300

[environment]
; Variables para el port (las hereda Uncharted.exe -> bb-probe.exe; las del campo Environment del launcher
; del port ganan a estas). UNDS_EVENTS lo pone siempre el lanzador (127.0.0.1:47111).
; UNDS_TRIGGER = recorrido de L2/R2 (0-255) al que el juego los da por pulsados: el segundo valor va justo
;                después del tope de los efectos WEAPON (calibrado con unds_triggers.py --calibrate).
; UNDS_RUMBLE=0  = el rumble de SDL no suena: los hápticos los genera UNDS (comparten actuadores).
UNDS_TRIGGER = 30,95
UNDS_RUMBLE = 0
